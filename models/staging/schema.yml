version: 2

models:
  - name: stg_customers
    description: "Customers, one row per customer_id."
    columns:
      - name: customer_id
        description: "Unique customer identifier (CUST_XXXXXX)."
        tests:
          - unique
          - not_null
      - name: subscription_plan
        description: "Subscription plan."
        tests:
          - not_null
          - accepted_values:
              values: ['basic', 'standard', 'premium']
              config:
                severity: warn
      - name: subscription_status
        description: "Subscription status."
        tests:
          - not_null
          - accepted_values:
              values: ['active', 'churned', 'paused']
              config:
                severity: warn

  - name: stg_product_events
    description: "Product events, one row per event. Deduplicated on event_id."
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: event_type
        tests:
          - accepted_values:
              values: ['login', 'stream_start', 'feature_use', 'support_ticket']
              config:
                severity: warn

  - name: stg_campaign_interactions
    description: "Campaign interactions, one row per funnel stage."
    columns:
      - name: interaction_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: channel
        tests:
          - accepted_values:
              values: ['email', 'push', 'sms', 'paid_social']
      - name: interaction_type
        tests:
          - accepted_values:
              values: ['sent', 'delivered', 'opened', 'clicked', 'unsubscribed']

  - name: stg_consent_registry
    description: "Consent records per customer and purpose. customer_id has been prefixed with CUST_ to match other tables."
    columns:
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: purpose_code
        tests:
          - relationships:
              to: ref('stg_consent_purpose_code')
              field: purpose_code

  - name: stg_consent_purpose_code
    description: "Lookup table for consent purposes and their legal grounds."
    columns:
      - name: purpose_code
        tests: [unique, not_null]